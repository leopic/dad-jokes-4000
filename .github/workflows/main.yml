name: CI

on:
  schedule:
    # Every 2 hours, Mon-Fri, 10:00-16:00 Berlin time (CEST/UTC+2 -> 08-14 UTC).
    # Minute 7 avoids the top-of-the-hour peak that GitHub delays/drops.
    # NOTE: GitHub cron is UTC only; in winter (CET/UTC+1) these shift 1h earlier locally.
    - cron: "7 8-17/2 * * 1-5"
  push:
    branches:
      - 'main'
  workflow_dispatch:

permissions:
  contents: write

env:
  TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
  TELEGRAM_CHAT: ${{ secrets.TELEGRAM_CHAT }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/checkout@v3
        with:
          repository: fabianonline/telegram.sh
          path: telegram.sh
      - run: mv telegram.sh/telegram .
      - run: ./main.sh
      - name: Commit seen jokes
        env:
          JOKE_TEXT: ${{ env.JOKE_TEXT }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add seen.json
          git diff --cached --quiet || git commit -m "chore: mark joke as seen" -m "$JOKE_TEXT"
          git push

name: Poll for joke requests

on:
  schedule:
    # Every 5 minutes, Mon-Fri, 8:00-20:00 Berlin time (CEST/UTC+2 -> 6-17 UTC).
    # NOTE: GitHub cron is UTC only; in winter (CET/UTC+1) this shifts 1h
    # earlier locally, i.e. 7:00-19:00 Berlin.
    - cron: "*/5 6-17 * * 1-5"
  workflow_dispatch:

concurrency:
  group: dad-jokes-4000

permissions:
  contents: write

env:
  TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
  TELEGRAM_CHAT: ${{ secrets.TELEGRAM_CHAT }}

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/checkout@v3
        with:
          repository: fabianonline/telegram.sh
          path: telegram.sh
      - run: mv telegram.sh/telegram .
      - run: ./poll.sh
      - name: Commit updated state
        env:
          JOKE_TEXT: ${{ env.JOKE_TEXT }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add offset.json seen.json
          git diff --cached --quiet || git commit -m "chore: poll for joke request" -m "$JOKE_TEXT"
          git push
